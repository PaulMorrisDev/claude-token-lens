id = "planning-requirements"
name = "Planning / requirements"
for = ["planning", "requirements", "architecture"]
archetype = "single-model"
notes = """
For sessions whose dominant purpose is classify.classify_purpose's \
"planning" signature and whose archetype stays "single-model" (one \
operator planning directly, at most two agents spawned -- \
workstyle.detect_archetype's single-model condition) rather than \
handing implementation off (that combination is "implementation-heavy" \
below, for the plan-high-implement-low archetype). \
agents.topology_effort_tokens's "high" row (thinking_share column) is \
exactly what recommend.py's effort-mismatch rule reads to flag \
*mis*-applied high effort on docs/general-dev work -- this profile is \
the deliberate opposite case: a planning session is exactly the purpose \
where a high thinking-token share is doing real work, so effortLevel is \
raised to "high" rather than lowered. promptCacheTtl is pinned to 1h: a \
planning session's own turns tend to run longer per exchange \
(sessions.sessions_by_purpose's "planning" row) than a chat-only \
session's, which is the same gap-length logic ttl.ttl_by_agent_type's \
per-type recommendation column already applies when it names 1h as an \
agent type's best_policy.
"""

[settings]
effortLevel = "high"
promptCacheTtl = "1h"
