<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-token-lens</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <h1>claude-token-lens</h1>
    <p class="app-subtitle">Local, read-only token and prompt-cache analytics</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Report sections" id="tabs">
    <button type="button" class="tab" role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="true" tabindex="0" data-tab="overview">Overview</button>
    <button type="button" class="tab" role="tab" id="tab-sessions" aria-controls="panel-sessions" aria-selected="false" tabindex="-1" data-tab="sessions">Sessions</button>
    <button type="button" class="tab" role="tab" id="tab-cache" aria-controls="panel-cache" aria-selected="false" tabindex="-1" data-tab="cache">Cache</button>
    <button type="button" class="tab" role="tab" id="tab-ttl" aria-controls="panel-ttl" aria-selected="false" tabindex="-1" data-tab="ttl">Cache lifetime (TTL)</button>
    <button type="button" class="tab" role="tab" id="tab-savings" aria-controls="panel-savings" aria-selected="false" tabindex="-1" data-tab="savings">Savings</button>
    <button type="button" class="tab" role="tab" id="tab-agents" aria-controls="panel-agents" aria-selected="false" tabindex="-1" data-tab="agents">Agents</button>
    <button type="button" class="tab" role="tab" id="tab-config" aria-controls="panel-config" aria-selected="false" tabindex="-1" data-tab="config">Config</button>
    <button type="button" class="tab" role="tab" id="tab-profiles" aria-controls="panel-profiles" aria-selected="false" tabindex="-1" data-tab="profiles">Profiles</button>
    <button type="button" class="tab" role="tab" id="tab-recommendations" aria-controls="panel-recommendations" aria-selected="false" tabindex="-1" data-tab="recommendations">Recommendations</button>
    <button type="button" class="tab" role="tab" id="tab-usage" aria-controls="panel-usage" aria-selected="false" tabindex="-1" data-tab="usage">Usage</button>
    <button type="button" class="tab" role="tab" id="tab-diagnostics" aria-controls="panel-diagnostics" aria-selected="false" tabindex="-1" data-tab="diagnostics">Data quality</button>
  </nav>

  <main class="tabpanels" id="tabpanels">
    <section class="panel" role="tabpanel" id="panel-overview" aria-labelledby="tab-overview" tabindex="0"></section>
    <section class="panel" role="tabpanel" id="panel-sessions" aria-labelledby="tab-sessions" tabindex="0" hidden></section>
    <section class="panel" role="tabpanel" id="panel-cache" aria-labelledby="tab-cache" tabindex="0" hidden></section>
    <section class="panel" role="tabpanel" id="panel-ttl" aria-labelledby="tab-ttl" tabindex="0" hidden></section>
    <section class="panel" role="tabpanel" id="panel-savings" aria-labelledby="tab-savings" tabindex="0" hidden></section>
    <section class="panel" role="tabpanel" id="panel-agents" aria-labelledby="tab-agents" tabindex="0" hidden></section>
    <section class="panel" role="tabpanel" id="panel-config" aria-labelledby="tab-config" tabindex="0" hidden></section>
    <section class="panel" role="tabpanel" id="panel-profiles" aria-labelledby="tab-profiles" tabindex="0" hidden></section>
    <section class="panel" role="tabpanel" id="panel-recommendations" aria-labelledby="tab-recommendations" tabindex="0" hidden></section>
    <section class="panel" role="tabpanel" id="panel-usage" aria-labelledby="tab-usage" tabindex="0" hidden></section>
    <section class="panel" role="tabpanel" id="panel-diagnostics" aria-labelledby="tab-diagnostics" tabindex="0" hidden></section>
  </main>

  <footer class="app-footer">
    <span id="footer-health">Checking service health&hellip;</span>
  </footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
